[project]
name = "tplab"
version = "0.1.0"
description = "Total portfolio risk, ALM and allocation analytics for institutional asset owners."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joel Mäkinen", email = "joelmaekinen@gmail.com" }]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# arch pulls in a compiled extension; kept separate so a wheel problem there
# never blocks the base install. Add it when we reach the GARCH estimator:
#   pip install -e ".[dev,garch]"
garch = ["arch>=7.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tplab"]

# ---------------------------------------------------------------------------
# Tooling. All of it configured here — no .flake8, no setup.cfg, no mypy.ini.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # import sorting
    "UP",  # modernise syntax for the target Python
    "B",   # likely bugs
    "SIM", # simplifications
]
ignore = [
    "N803",  # argument name should be lowercase — financial notation uses N, T, S
    "N806",  # variable in function should be lowercase — same reason
]

[tool.mypy]
python_version = "3.11"
files = ["src/tplab"]
strict = true

[[tool.mypy.overrides]]
# These ship without type information; not our problem to fix.
module = ["matplotlib.*", "scipy.*", "arch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
